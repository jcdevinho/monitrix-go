<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitrix | Login & Registro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
    <div class="flex justify-between mb-6 border-b">
      <button id="btnSignup" class="w-1/2 text-center py-2 border-b-2 border-blue-600 text-blue-600 font-semibold">Registrar</button>
      <button id="btnLogin" class="w-1/2 text-center py-2 border-b-2 border-transparent text-gray-600">Login</button>
    </div>

    <!-- Registro -->
    <form id="signupForm" class="space-y-4">
      <input type="text" name="name" placeholder="Nome" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <input type="email" name="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <input type="password" name="password" placeholder="Senha" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Registrar</button>
    </form>

    <!-- Login -->
    <form id="loginForm" class="space-y-4 hidden">
      <input type="email" name="email" placeholder="Email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <input type="password" name="password" placeholder="Senha" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Entrar</button>
    </form>
  </div>
</body>
</html>

<script type="module" src="./assets/js/main.js"></script>
